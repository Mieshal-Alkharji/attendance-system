<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Portal | SmartCheck</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    /* PAGE-SPECIFIC UI COMPONENTS:
       Scoped styles for the dynamic transitions and form elements.
    */
    #courseNameDisplay {
      background: #ecf0f1;
      padding: 10px;
      border-radius: 5px;
      color: #2980b9;
      font-size: 1.1em;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #34495e;
    }

    .styled-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .styled-input:focus {
      border-color: #3498db;
      outline: none;
    }

    /* SECTION CONTROL:
       We use 'display: none' as the default state for the form and success message.
       JavaScript (student.js) will toggle these based on the QR validation state.
    */
    #form-section, #success-section {
      display: none;
      animation: fadeIn 0.5s ease-in-out;
    }

    /* VISUAL FEEDBACK: Styles for the successful check-in state */
    .success-icon {
      font-size: 60px;
      color: #27ae60;
      margin-bottom: 15px;
    }

    /* ANIMATIONS: Enhances the User Experience (UX) with smooth transitions */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="navbar">
  <h1>Student Portal</h1>
</div>

<div class="container">
  <div class="card">

    <div id="scanner-section">
      <h3>Scan Class QR Code</h3>
      <div id="reader" style="width: 100%; border-radius: 10px; overflow: hidden; background: #f9f9f9;"></div>
      <p style="color: #7f8c8d; font-size: 0.9em; margin-top: 10px;">
        Point your camera at the lecturer's screen to begin.
      </p>
    </div>

    <div id="form-section">
      <h3 id="courseNameDisplay">Verifying Session...</h3>

      <div class="input-group">
        <label for="inputName">Full Name</label>
        <input type="text" id="inputName" class="styled-input" placeholder="Enter your registered name">
      </div>

      <div class="input-group">
        <label for="inputID">Student ID Number</label>
        <input type="text" id="inputID" class="styled-input" placeholder="Enter your official ID">
      </div>

      <button id="submitBtn" onclick="submitAttendance()" style="width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;">
        Confirm Presence
      </button>
    </div>

    <div id="success-section" style="text-align: center; padding: 20px;">
      <div class="success-icon">✅</div>
      <h2 class="success-title">Success!</h2>
      <p class="success-text">
        Your attendance has been officially verified and recorded.<br>
        You may now safely close this window.
      </p>
    </div>

  </div>
</div>

<script type="module" src="student.js"></script>
</body>
</html>
